<!DOCTYPE html>

<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="style.css">

        <title>RacingForms</title>

        <link rel="icon" type="image/ico"
            href="resources/ico/icone do site.ico">
    </head>

    <body class="background">

        <header class="headerForm">
            <h1>🏃 Formulário para Participação da Corrida 🏃</h1>
        </header>

        <main class="contentForm">
            <form action>
                <fieldset id="FormBackground">
                    <legend><strong>Formulário de Contato</strong></legend>

                    <label for="nome"><strong>Nome:</strong></label>
                    <input type="text" id="nome" name="nome" required><br><br>

                    <label for="sobrenome"><strong>Sobrenome:</strong></label>
                    <input type="text" id="sobrenome" name="sobrenome"
                        required><br><br>

                    <label for="idade"><strong>Idade:</strong></label>
                    <input type="date" id="idade" name="idade"
                        required><br><br>

                    <label for="cpf"><strong>CPF:</strong></label>
                    <input type="text" id="cpf" name="cpf" required><br><br>

                    <label for="telefone"><strong>Telefone:</strong></label>
                    <input type="tel" id="telefone" name="telefone"
                        required><br><br>

                    <label for="email"><strong>Email:</strong></label>
                    <input type="email" id="email" name="email"
                        required><br><br>

                    <label for="cidade"><strong>Cidade:</strong></label>
                    <select id="cidade" name="cidade" required>
                        <option value>Selecione</option>
                        <option value="sao_paulo">São Paulo</option>
                        <option value="rio_de_janeiro">Rio de Janeiro</option>
                        <option value="belo_horizonte">Belo Horizonte</option>
                        <option value="curitiba">Curitiba</option>
                        <option value="porto_alegre">Porto Alegre</option>
                    </select><br><br>

                    <label for="genero"><strong>Gênero:</strong></label><br><br>
                    <input type="radio" id="masculino" name="genero"
                        value="masculino" required>
                    <label for="masculino">Masculino</label><br>
                    <input type="radio" id="feminino" name="genero"
                        value="feminino">
                    <label for="feminino">Feminino</label><br><br>

                    <label for="corrida"><strong>Distância da
                            Corrida:</strong></label><br><br>
                    <input type="radio" id="corrida" name="corrida" value="5km"
                        required>
                    <label for="corrida">5km</label><br>
                    <input type="radio" id="corrida" name="corrida"
                        value="10km">
                    <label for="corrida">10km</label><br>
                    <input type="radio" id="corrida" name="corrida"
                        value="maratona">
                    <label for="corrida">15km</label><br><br>

                    <label for="premio"><strong>Qual prêmio você deseja
                            ganhar?</strong></label><br><br>
                    <input type="checkbox" id="premio1" name="premio"
                        value="medalha">
                    <label for="premio1">Medalha</label><br>
                    <input type="checkbox" id="premio2" name="premio"
                        value="camiseta">
                    <label for="premio2">Camiseta</label><br>
                    <input type="checkbox" id="premio3" name="premio"
                        value="trofeu">
                    <label for="premio3">Banana</label><br><br>

                    <label for="mensagem"><strong>Por que você deseja
                            participar?</strong></label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" cols="30"
                        required></textarea><br><br>

                    <input type="submit" value="Enviar" name="submitButton">
                </fieldset>
            </form>
        </main>
    </body>

</html>

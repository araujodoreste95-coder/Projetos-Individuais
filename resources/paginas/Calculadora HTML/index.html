<!DOCTYPE html>

<html>
    <head lang="pt-BR">

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="description" content="Uma calculadora simples de usar!">

        <meta name="author" content="Renan S.A Doreste">

        <!-- Garante que o script seja carregado após o carreganmento do site, 
    evitando erros de leitura do script. -->
        <link rel="stylesheet" href="css/styles.css">

        <script src="js/node.js" defer></script>
    </head>

    <body>

        <div id="calc">
            <h3>Calculadora Online</h3>

            <div id="operations">
                <div id="previous-operations"></div>

                <div id="current-operations"></div>
            </div>

            <div id="buttons-container">
                <button>CE</button>
                <button>C</button>
                <button>DEL</button>
                <button>/</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button>*</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button>-</button>
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button>+</button>
                <button class="number">0</button>
                <button class="number">.</button>
                <button id="equal-btn">=</button>
            </div>
        </div>
    </body>

</html>
